server:
  port: 8030

spring:
  application:
    name: customer
  datasource:
    url: jdbc:mysql://localhost:3302/customerdb
    username: root
    password: customer
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always
eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
