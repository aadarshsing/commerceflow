server:
  port: 8050

spring:
  application:
    name: order
  datasource:
    url: jdbc:mysql://localhost:3304/orderDb
    username: root
    password: order
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    root: INFO
    com.order: DEBUG